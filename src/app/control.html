<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; media-src 'self' blob:" />
    <title>Unfinished Business</title>
    <link rel="stylesheet" href="control.css" />
  </head>
  <body>
    <header class="drag">
      <div class="mark" aria-hidden="true">👻</div>
      <h1>Unfinished Business</h1>
      <p class="tagline">The emails you never answered are coming back.</p>
    </header>

    <main>
      <section id="step-gmail" class="step">
        <div class="num">1</div>
        <div class="content">
          <h2>Connect your Gmail</h2>
          <div class="body"></div>
        </div>
      </section>

      <section id="step-voice" class="step">
        <div class="num">2</div>
        <div class="content">
          <h2>Give them a voice</h2>
          <div class="body"></div>
        </div>
      </section>

      <section id="step-scan" class="step">
        <div class="num">3</div>
        <div class="content">
          <h2>See who’s waiting</h2>
          <div class="body"></div>
        </div>
      </section>

      <section id="step-release" class="step">
        <div class="num">4</div>
        <div class="content">
          <h2>Let them in</h2>
          <div class="body"></div>
        </div>
      </section>
    </main>

    <footer>
      <p>Read-only: the app can’t send, delete or change your mail.<br />Kill switch: <kbd>⌘</kbd><kbd>⌥</kbd><kbd>⇧</kbd><kbd>G</kbd> or the 👻 in the menu bar.</p>
      <button id="undo" class="link danger">Undo everything…</button>
    </footer>

    <div id="toast" role="status" aria-live="polite"></div>
    <script src="control.js"></script>
  </body>
</html>
