name: Mac app

# Tests every change, builds a double-clickable Unfinished Business.dmg for
# Apple Silicon and Intel Macs, and publishes it as a GitHub Release on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package the app
        run: npx electron-builder --mac dir --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sign ad hoc and build the disk image
        run: |
          set -euo pipefail
          APP=$(ls -d dist/mac*/"Unfinished Business.app")
          # No Apple Developer ID, so sign ad hoc: macOS shows "unidentified
          # developer" (fixable with Open Anyway) instead of "damaged".
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir -p stage out
          cp -R "$APP" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "Unfinished Business" -srcfolder stage -ov -format UDZO \
            "out/Unfinished-Business-${{ matrix.arch == 'arm64' && 'Apple-Silicon' || 'Intel' }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: out/*.dmg

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.dmg --clobber
          else
            gh release create "$TAG" out/*.dmg --title "Unfinished Business $TAG" --notes-file .github/release-notes.md
          fi
